# DAFU MOMENT 前端 Nginx：SPA 路由 + /api 反代后端 + /img 反代 MinIO（静态缓存头）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源 immutable 缓存（Vite 带 hash）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API 反代
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # 图片直连 MinIO 公共桶
    location /img/ {
        proxy_pass http://minio:9000/dafu-images/;
        add_header Cache-Control "public, max-age=86400";
    }

    # 入口页禁止缓存（防止浏览器启发式缓存旧 index.html → 加载已删除的旧 chunk）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # SPA 兜底（fallback 命中的 /index.html 同样带 no-cache）
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
